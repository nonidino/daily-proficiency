<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Proficiency</title>
<meta name="description" content="Log what you did each day, from when to when, as color-coded time blocks.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Proficiency">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
:root{
  --bg:#F3F4F6;
  --surface:#FFFFFF;
  --surface-2:#E9EBEF;
  --ink:#14171C;
  --muted:#636A75;
  --line:#DDE0E6;
  --hour:#DFE2E7;
  --half:#EEF0F3;
  --primary:#14171C;
  --on-primary:#FFFFFF;
  --danger:#C92A2A;
  --now:#E5484D;
  --scrim:rgba(12,14,18,.36);
  --shadow:0 12px 32px rgba(16,20,28,.16);
  --block-edge:rgba(0,0,0,.07);
  --hr:64px;
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014;--surface:#171A20;--surface-2:#22262D;--ink:#EDEFF2;--muted:#9AA1AC;
    --line:#2A2E36;--hour:#252930;--half:#191C21;--primary:#EDEFF2;--on-primary:#0E1014;
    --danger:#FF7070;--now:#FF5A5F;--scrim:rgba(0,0,0,.56);--shadow:0 12px 32px rgba(0,0,0,.5);
    --block-edge:rgba(255,255,255,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014;--surface:#171A20;--surface-2:#22262D;--ink:#EDEFF2;--muted:#9AA1AC;
  --line:#2A2E36;--hour:#252930;--half:#191C21;--primary:#EDEFF2;--on-primary:#0E1014;
  --danger:#FF7070;--now:#FF5A5F;--scrim:rgba(0,0,0,.56);--shadow:0 12px 32px rgba(0,0,0,.5);
  --block-edge:rgba(255,255,255,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--ui);-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 10px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;gap:4px;border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.datebtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;border-radius:12px;cursor:pointer}
.datebtn:active{background:var(--surface-2)}
.datebtn .wd{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;letter-spacing:-.01em}
.datebtn .sub{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.datebtn .rel{color:var(--ink);font-weight:600}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;-webkit-appearance:none;appearance:none;cursor:pointer;font-size:16px}
.seg{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:11px;padding:3px;margin:6px 4px 0}
.seg button{border:0;background:transparent;border-radius:8px;min-height:34px;font-size:14px;font-weight:650;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.todaybtn{justify-self:center;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}

/* ---------- Summary ---------- */
.summary{margin-top:6px;background:var(--surface);border-radius:16px;padding:14px 16px 12px;box-shadow:inset 0 0 0 1px var(--line)}
.sum-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sum-total{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sum-count{font-size:13px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:10px;background:var(--surface-2);gap:2px}
.bar span{display:block;height:100%}
.legend{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px}
.legend li{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.legend .d{color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px var(--block-edge)}
.empty{margin:4px 0 2px;color:var(--muted);font-size:15px}

/* ---------- Week summary ---------- */
.wk-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.wk-top .right{text-align:right}
.sum-cap{font-size:13px;color:var(--muted)}
.wtable{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 18px;margin-top:14px;font-size:14px;align-items:center}
.wtable .h{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.wtable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wtable .avg{color:var(--muted)}
.wtable .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:550}
.wtable .nm span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtable .mb{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);margin:5px 0 9px;overflow:hidden}
.wtable .mb i{display:block;height:100%;border-radius:2px}

/* ---------- Week calendar ---------- */
.week{margin-top:16px;--whr:44px;--wcol:84px}
.wk-head{position:sticky;top:var(--topbar-h,112px);z-index:10;display:grid;grid-template-columns:38px minmax(0,1fr);
  margin-inline:-16px;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.wk-head-vp{overflow:hidden}
.wk-head-track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:max(100%,calc(7 * var(--wcol)));will-change:transform}
.wk-day{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;border-radius:10px;cursor:pointer;min-width:0}
.wk-day:active{background:var(--surface-2)}
.wk-day .dow{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.wk-day .dnum{font-family:var(--display);font-size:18px;font-weight:700;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.wk-day.is-today .dnum{background:var(--primary);color:var(--on-primary)}
.wk-day.is-today .dow{color:var(--ink)}
.wk-day .dtot{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:13px}
.wk-body{display:grid;grid-template-columns:38px minmax(0,1fr);padding-block:10px}
.wk-hours{position:relative}
.wk-hours span{position:absolute;right:6px;transform:translateY(-50%);font-size:10px;font-weight:500;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.wk-scroll{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wk-scroll::-webkit-scrollbar{display:none}
.wk-cols{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:max(100%,calc(7 * var(--wcol)));border-left:1px solid var(--line);border-bottom:1px solid var(--hour);
  background-image:linear-gradient(var(--hour) 1px,transparent 1px);background-size:100% var(--whr)}
.wk-col{position:relative;border-right:1px solid var(--half);cursor:copy;min-width:0;scroll-snap-align:start}
.wk-col.is-today{background:color-mix(in srgb,var(--now) 5%,transparent)}
.wblock{position:absolute;border:0;border-radius:6px;padding:3px 5px;font-size:11px;line-height:1.15;font-weight:650;text-align:left;overflow:hidden;cursor:pointer;
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;box-shadow:inset 0 0 0 1px var(--block-edge);display:block}
.wblock:active{filter:brightness(.94)}
.wblock .wr{display:block;font-weight:500;font-size:10px;opacity:.85;margin-top:1px;font-variant-numeric:tabular-nums;-webkit-hyphens:none;hyphens:none}

/* ---------- Timeline (day) ---------- */
.timeline{position:relative;display:grid;grid-template-columns:48px 1fr;margin-top:16px;padding-block:10px}
.hours{position:relative;height:calc(24 * var(--hr))}
.hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{position:relative;height:calc(24 * var(--hr) + 1px);border-left:1px solid var(--line);cursor:copy;
  background-image:linear-gradient(var(--hour) 1px,transparent 1px),linear-gradient(var(--half) 1px,transparent 1px);
  background-size:100% var(--hr),100% calc(var(--hr) / 2)}
.block{position:absolute;border:0;border-radius:8px;padding:4px 8px;text-align:left;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:flex-start;box-shadow:inset 0 0 0 1px var(--block-edge),0 1px 2px rgba(0,0,0,.08);
  transition:transform .12s ease}
.block:active{transform:scale(.985)}
.block .t{font-weight:650;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.block .r{font-size:12px;line-height:1.25;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block.short{flex-direction:row;align-items:center;gap:6px;padding-block:0}
.block.short .t{font-size:12.5px;flex:0 1 auto}
.block.short .r{font-size:11px;flex:0 1 auto}
.block.tiny{padding-inline:6px}
.block.tiny .r{display:none}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--now);pointer-events:none;z-index:5}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}

@keyframes inL{from{opacity:.2;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:.2;transform:translateX(-24px)}to{opacity:1;transform:none}}
.view.inL{animation:inL .22s ease-out}
.view.inR{animation:inR .22s ease-out}

/* ---------- FAB ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;max-width:640px;margin:0 auto;padding-inline:16px;
  display:flex;gap:10px;justify-content:flex-end;align-items:center;pointer-events:none}
.dock > *{pointer-events:auto}
.fab{flex:none;height:58px;padding:0 22px 0 18px;border:0;border-radius:29px;background:var(--primary);color:var(--on-primary);
  display:flex;align-items:center;gap:8px;font-weight:650;font-size:17px;box-shadow:var(--shadow);cursor:pointer}
.fab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.fab:active{transform:scale(.97)}
.dock.has-live .fab{width:58px;padding:0;justify-content:center}
.dock.has-live .fab-lbl{display:none}
.live{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:58px;padding-right:7px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.live-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:100%;border:0;background:transparent;text-align:left;padding:0 6px 0 14px;cursor:pointer;border-radius:18px}
.live-dot{position:relative;width:12px;height:12px;border-radius:50%;flex:none}
.live-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.3);opacity:0}}
.live-text{flex:1;min-width:0;display:flex;flex-direction:column}
.live-title{font-weight:650;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-time{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.live-end{flex:none;border:0;height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.live-end:active{filter:brightness(.92)}
.block.is-live,.wblock.is-live{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.24) 0 6px,transparent 6px 12px)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0 auto;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet-head h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.sheet-date{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:5px 12px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600;cursor:pointer}
.sheet-date svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sheet-date input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;-webkit-appearance:none;appearance:none;cursor:pointer;font-size:16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:15px;font-weight:550}
.setting .seg{margin:0;min-width:180px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=time]{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);
  padding:0 14px;font:17px var(--ui);-webkit-appearance:none;appearance:none;display:block}
input[type=time]{font-variant-numeric:tabular-nums;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus{outline:2px solid var(--ink);outline-offset:0}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:0;border-radius:12px;background:var(--surface-2);
  text-align:left;font-size:15px;font-weight:550;cursor:pointer;min-width:0}
.cat span:last-child{line-height:1.15}
.cat .sw{width:16px;height:16px;border-radius:5px}
.cat[aria-pressed="true"]{background:var(--c);color:var(--fg);box-shadow:inset 0 0 0 2px var(--block-edge)}
.cat[aria-pressed="true"] .sw{box-shadow:inset 0 0 0 2px currentColor;background:transparent}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1 0 auto;min-height:38px;padding:0 10px;border:0;border-radius:10px;background:var(--surface-2);font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.quick button:active{background:var(--line)}
.durline{margin:-4px 0 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;margin-top:2px}
.btn{min-height:52px;border:0;border-radius:14px;font-size:17px;font-weight:650;cursor:pointer;padding:0 18px}
.btn.primary{flex:1;background:var(--primary);color:var(--on-primary)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.btn.secondary{background:var(--surface-2);color:var(--ink)}
#modeSeg{margin:0}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.45}
.btn.plain{width:100%;background:var(--surface-2);text-align:left;display:flex;align-items:center;justify-content:space-between}
.menu-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.menu-note{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.5}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;opacity:0;pointer-events:none;
  background:var(--primary);color:var(--on-primary);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;
  font-size:15px;font-weight:550;box-shadow:var(--shadow);transition:opacity .18s,transform .18s;width:max-content;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:inherit;font-weight:750;text-decoration:underline;padding:4px 6px;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <label class="datebtn" for="datePick">
      <span class="wd" id="wd">Saturday</span>
      <span class="sub"><span id="dlong">Sep 26</span><span class="rel" id="rel"></span></span>
      <input type="date" id="datePick" aria-label="Pick a date">
    </label>
    <button class="icon-btn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="icon-btn" id="menuBtn" aria-label="Backup and settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button type="button" data-view="day" aria-pressed="true">Day</button>
      <button type="button" data-view="week" aria-pressed="false">Week</button>
    </div>
  </header>

  <div style="display:flex;justify-content:center"><button class="todaybtn" id="todayBtn" hidden>Back to today</button></div>
  <div id="views">
    <main class="view" id="dayView">
      <section class="summary" id="summary" aria-live="polite"></section>
      <section class="timeline" aria-label="Timeline">
        <div class="hours" id="hours"></div>
        <div class="grid" id="grid"></div>
      </section>
    </main>
    <main class="view" id="weekView" hidden>
      <section class="summary" id="weekSummary" aria-live="polite"></section>
      <section class="week" aria-label="Week calendar">
        <div class="wk-head" id="wkHead"><span></span><div class="wk-head-vp"><div class="wk-head-track" id="wkHeadTrack"></div></div></div>
        <div class="wk-body">
          <div class="wk-hours" id="wkHours"></div>
          <div class="wk-scroll" id="wkScroll"><div class="wk-cols" id="wkCols"></div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="dock" id="dock">
  <div class="live" id="live" hidden>
    <button type="button" class="live-main" id="liveOpen" aria-label="Edit the activity in progress">
      <span class="live-dot" id="liveDot"></span>
      <span class="live-text"><span class="live-title" id="liveTitle"></span><span class="live-sub"><span class="live-time" id="liveTime"></span> · <span id="liveSub"></span></span></span>
    </button>
    <button type="button" class="live-end" id="liveEnd">End</button>
  </div>
  <button class="fab" id="fab" aria-label="Log an activity"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="fab-lbl">Log</span></button>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="entrySheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <div>
      <h2 id="entryTitle">New entry</h2>
      <label class="sheet-date" for="fDate" id="fDateWrap"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="fDateLbl">Today</span><input type="date" id="fDate" aria-label="Day of this entry"></label>
    </div>
    <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <form id="entryForm" novalidate>
    <div class="seg" id="modeSeg" role="group" aria-label="How to log">
      <button type="button" data-mode="past" aria-pressed="true">Log past</button>
      <button type="button" data-mode="start" aria-pressed="false">Start now</button>
    </div>
    <p class="note" id="runNote" hidden></p>
    <label class="field"><span class="lbl">What did you do?</span>
      <input type="text" id="fTitle" list="titleList" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="e.g. Chem problem set">
    </label>
    <datalist id="titleList"></datalist>
    <div class="field"><span class="lbl">Type</span><div class="cats" id="catGrid"></div></div>
    <div class="times">
      <label class="field"><span class="lbl" id="fromLbl">From</span><input type="time" id="fStart" step="300"></label>
      <label class="field" id="toField"><span class="lbl">To</span><input type="time" id="fEnd" step="300"></label>
    </div>
    <div class="quick" id="quick" aria-label="Set length">
      <button type="button" data-m="15">15m</button><button type="button" data-m="30">30m</button><button type="button" data-m="45">45m</button>
      <button type="button" data-m="60">1h</button><button type="button" data-m="90">1½h</button><button type="button" data-m="120">2h</button>
    </div>
    <p class="durline" id="durLine"></p>
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn">Delete</button>
      <button type="button" class="btn secondary" id="altBtn" hidden>Save</button>
      <button type="submit" class="btn primary" id="saveBtn">Save</button>
    </div>
  </form>
</section>

<section class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="menuTitle">Your data</h2>
    <button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="menu-list">
    <button class="btn plain" id="exportBtn">Export backup <span aria-hidden="true">↓</span></button>
    <label class="btn plain" for="importFile" style="cursor:pointer">Import backup <span aria-hidden="true">↑</span></label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div class="setting"><span>Week starts on</span>
    <div class="seg" id="wsSeg" role="group" aria-label="Week starts on">
      <button type="button" data-ws="1" aria-pressed="true">Monday</button>
      <button type="button" data-ws="0" aria-pressed="false">Sunday</button>
    </div>
  </div>
  <p class="menu-note" id="statsNote"></p>
  <p class="menu-note">Entries are saved on this phone only. Add the app to your Home Screen (Share → Add to Home Screen) so iOS keeps your data, and export a backup now and then.</p>
</section>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(function(){
"use strict";

/* ---------- Categories ---------- */
const CATS = [
  {id:"school",   name:"Schoolwork",          color:"#F4C430"},
  {id:"errands",  name:"Errands",             color:"#9CA2AB"},
  {id:"misc",     name:"Miscellaneous",       color:"#C9CDD3"},
  {id:"club",     name:"Club work",           color:"#F28A2E"},
  {id:"hiw",      name:"High intensity work", color:"#2F7FEA"},
  {id:"math",     name:"Math",                color:"#1D2C62"},
  {id:"piano",    name:"Piano",               color:"#2E9E5B"},
  {id:"off",      name:"Off task",            color:"#F59CC4"},
  {id:"gf",       name:"GF",                  color:"#DC2F2F"},
  {id:"exercise", name:"Exercise",            color:"#8B5CF6"},
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
function textOn(hex){
  const n = parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const lin = v => v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4);
  const L = .2126*lin(r)+.7152*lin(g)+.0722*lin(b);
  return L > .32 ? "#15171C" : "#FFFFFF";
}
CATS.forEach(c => c.fg = textOn(c.color));

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHHMM = m => { m = ((m%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function hm(m){ m = ((m%1440)+1440)%1440; let h = Math.floor(m/60); const mi = m%60, ap = h<12 ? "AM" : "PM"; h = h%12 || 12; return {h, mi, ap}; }
function fmt(m, withAp=true){ const t = hm(m); const s = t.mi ? `${t.h}:${pad(t.mi)}` : `${t.h}`; return withAp ? `${s} ${t.ap}` : s; }
function fmtRange(s,e){
  const a = hm(s), b = hm(e);
  return a.ap === b.ap && e - s < 720 ? `${fmt(s,false)}–${fmt(e)}` : `${fmt(s)}–${fmt(e)}`;
}
function dur(m){ const h = Math.floor(m/60), mi = m%60; return h ? (mi ? `${h}h ${mi}m` : `${h}h`) : `${mi}m`; }
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Storage ---------- */
const KEY = "daily-proficiency.v1";
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (d && typeof d.days === "object") return d; } } catch(e){}
  return {days:{}, lastCat:"school"};
}
let db = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast("Couldn't save on this device. Export a backup."); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
const entries = day => (db.days[day] || []);

/* ---------- State ---------- */
let day = today();
let view = db.view === "week" ? "week" : "day";
let editing = null;        // entry id or null
let editDay = null;        // day the entry being edited lives on
let selCat = null;
let catTouched = false;

/* ---------- Timer ---------- */
// db.running = {title, cat, day, start}. It is a single slot, so only one activity can ever be in progress.
const LIVE = "__live";
let sheetMode = "past";    // past | edit | start | running
let pastVals = null;       // times the "Log past" tab had before switching to "Start now"
const runStart = r => { const d = parseYmd(r.day); d.setMinutes(r.start); return d; };
const runMins = r => Math.floor((Date.now() - runStart(r))/60000);
function liveEntry(d){
  const r = db.running;
  if (!r || r.day !== d) return null;
  return {id:LIVE, title:r.title, cat:r.cat, start:r.start, end:r.start + clamp(runMins(r), 1, 1440), live:true};
}
const withLive = d => { const l = liveEntry(d); return l ? entries(d).concat(l) : entries(d); };
// Turns the running activity into a logged entry ending at `at` (a Date).
function endRunning(at){
  const r = db.running; if (!r) return null;
  db.running = null;
  const mins = Math.min(Math.floor((at - runStart(r))/60000), 1440);
  if (mins < 1) return {r};
  const entry = {id:uid(), title:r.title, cat:r.cat, start:r.start, end:r.start + mins};
  const list = db.days[r.day] || (db.days[r.day] = []);
  list.push(entry); list.sort((a,b) => a.start - b.start);
  return {r, entry};
}
const restore = snap => () => { db = JSON.parse(snap); save(); render(); };

/* ---------- Weeks ---------- */
const WHR = 44;            // week view hour height; matches --whr in CSS
let wkLo = 0;              // first minute shown in the week grid
const weekStartOf = s => { const d = parseYmd(s), ws = db.weekStart === 0 ? 0 : 1; d.setDate(d.getDate() - (d.getDay() - ws + 7) % 7); return ymd(d); };
const weekDays = s => { const ws = weekStartOf(s); return Array.from({length:7}, (_,i) => addDays(ws, i)); };
const minsOf = x => Math.min(x.end, 1440) - x.start;
const hrs = m => m < 60 ? m + "m" : (Math.round(m/6)/10) + "h";
const isVisible = d => view === "day" ? d === day : weekDays(day).includes(d);
function dayName(d){
  const t = today();
  if (d === t) return "Today";
  if (d === addDays(t,-1)) return "Yesterday";
  if (d === addDays(t,1)) return "Tomorrow";
  const dt = parseYmd(d);
  return dt.toLocaleDateString(undefined, dt.getFullYear() === new Date().getFullYear() ? {weekday:"short",month:"short",day:"numeric"} : {month:"short",day:"numeric",year:"numeric"});
}

/* ---------- Header ---------- */
function renderHeader(){
  const t = today(), thisYear = new Date().getFullYear();
  if (view === "week"){
    const days = weekDays(day), a = parseYmd(days[0]), b = parseYmd(days[6]);
    const md = {month:"short", day:"numeric"};
    $("wd").textContent = a.toLocaleDateString(undefined, md) + " – " + (a.getMonth() === b.getMonth() ? b.getDate() : b.toLocaleDateString(undefined, md));
    const tw = weekStartOf(t);
    const rel = days[0] === tw ? "This week" : days[0] === addDays(tw,-7) ? "Last week" : days[0] === addDays(tw,7) ? "Next week" : "";
    const yr = b.getFullYear() !== thisYear || !rel ? String(b.getFullYear()) : "";
    $("dlong").textContent = yr;
    $("rel").textContent = rel ? (yr ? "· " : "") + rel : "";
    $("todayBtn").textContent = "Back to this week";
    $("todayBtn").hidden = days.includes(t);
    $("prevDay").setAttribute("aria-label", "Previous week");
    $("nextDay").setAttribute("aria-label", "Next week");
  } else {
    const d = parseYmd(day);
    $("wd").textContent = d.toLocaleDateString(undefined,{weekday:"long"});
    $("dlong").textContent = d.toLocaleDateString(undefined, d.getFullYear() === thisYear ? {month:"short",day:"numeric"} : {month:"short",day:"numeric",year:"numeric"});
    const rel = day === t ? "Today" : day === addDays(t,-1) ? "Yesterday" : day === addDays(t,1) ? "Tomorrow" : "";
    $("rel").textContent = rel ? "· " + rel : "";
    $("todayBtn").textContent = "Back to today";
    $("todayBtn").hidden = day === t;
    $("prevDay").setAttribute("aria-label", "Previous day");
    $("nextDay").setAttribute("aria-label", "Next day");
  }
  $("datePick").value = day;
  document.querySelectorAll("#viewSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
}

/* ---------- Day summary ---------- */
function renderSummary(){
  const list = withLive(day);
  const el = $("summary");
  if (!list.length){
    el.innerHTML = `<div class="sum-head"><span class="sum-total">0h</span><span class="sum-count">nothing logged</span></div>
      <p class="empty">Tap <b>Log</b>, or tap an hour on the timeline to add what you did.</p>`;
    return;
  }
  const tot = {}; let all = 0;
  list.forEach(x => { const m = minsOf(x); tot[x.cat] = (tot[x.cat]||0) + m; all += m; });
  const rows = CATS.filter(c => tot[c.id]).sort((a,b) => tot[b.id]-tot[a.id]);
  el.innerHTML = `
    <div class="sum-head"><span class="sum-total">${dur(all)}</span><span class="sum-count">${list.length} ${list.length===1?"entry":"entries"}</span></div>
    <div class="bar" role="img" aria-label="Time by type">${rows.map(c => `<span style="background:${c.color};flex:${tot[c.id]}"></span>`).join("")}</div>
    <ul class="legend">${rows.map(c => `<li><span class="sw" style="background:${c.color}"></span><span class="nm">${esc(c.name)}</span><span class="d">${dur(tot[c.id])}</span></li>`).join("")}</ul>`;
}

/* ---------- Day timeline ---------- */
function hourPx(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hr")) || 64; }
(function buildHours(){
  const h = $("hours"); let html = "";
  for (let i = 0; i <= 24; i++){ const t = hm(i*60); html += `<span style="top:calc(${i} * var(--hr))">${i===24 ? "" : i===12 ? "Noon" : t.h+" "+t.ap}</span>`; }
  h.innerHTML = html;
})();

function layout(list){
  const items = [...list].sort((a,b) => a.start-b.start || b.end-a.end).map(x => ({x, col:0, cols:1}));
  let cluster = [], cEnd = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(it => { let c = cols.findIndex(e => e <= it.x.start); if (c < 0){ c = cols.length; cols.push(0); } cols[c] = it.x.end; it.col = c; });
    cluster.forEach(it => it.cols = cols.length);
    cluster = []; cEnd = -1;
  };
  items.forEach(it => { if (cluster.length && it.x.start >= cEnd) flush(); cluster.push(it); cEnd = Math.max(cEnd, it.x.end); });
  flush();
  return items;
}

function renderGrid(){
  const g = $("grid"), H = hourPx();
  const frag = document.createDocumentFragment();
  layout(withLive(day)).forEach(({x, col, cols}) => {
    const c = CAT[x.cat] || CAT.misc;
    const end = Math.min(x.end, 1440);
    const top = x.start/60*H, h = Math.max((end - x.start)/60*H - 2, 16);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "block" + (h < 38 ? " short" : "") + (h < 20 ? " tiny" : "") + (x.live ? " is-live" : "");
    b.dataset.id = x.id;
    b.style.cssText = `top:${top+1}px;height:${h}px;left:calc(${col} * (100% - 6px) / ${cols} + 4px);width:calc((100% - 6px) / ${cols} - 3px);background:${c.color};color:${c.fg}`;
    const range = x.live ? fmt(x.start) + "–now" : fmtRange(x.start, x.end) + (x.end > 1440 ? " (+1)" : "");
    b.setAttribute("aria-label", `${x.title}, ${c.name}, ${range}`);
    b.innerHTML = `<span class="t">${esc(x.title)}</span><span class="r">${range}${h >= 56 && x.title !== c.name ? " · " + esc(c.name) : ""}</span>`;
    frag.appendChild(b);
  });
  g.replaceChildren(frag);
  renderNow();
}

function renderNow(){
  if (view === "week"){
    const n = document.querySelector("#wkCols .now");
    if (n) n.style.top = ((nowMin() - wkLo)/60*WHR) + "px";
    return;
  }
  const g = $("grid");
  let n = g.querySelector(".now");
  if (day !== today()){ if (n) n.remove(); return; }
  if (!n){ n = document.createElement("div"); n.className = "now"; g.appendChild(n); }
  n.style.top = (nowMin()/60*hourPx()) + "px";
}

/* ---------- Week view ---------- */
function renderWeekSummary(days, per, t){
  const el = $("weekSummary");
  const tot = {}; let all = 0;
  per.flat().forEach(x => { const m = minsOf(x); tot[x.cat] = (tot[x.cat]||0) + m; all += m; });
  if (!all){
    el.innerHTML = `<div class="sum-head"><span class="sum-total">0h</span><span class="sum-count">nothing logged this week</span></div>
      <p class="empty">Tap a spot in a day's column to add an entry, or tap a date to open that day.</p>`;
    return;
  }
  // Averages divide by days of this week that have started (all 7 for past weeks).
  const elapsed = t < days[0] ? 0 : t > days[6] ? 7 : days.indexOf(t) + 1;
  const avg = m => elapsed ? dur(Math.round(m/elapsed)) : "–";
  const avgCap = elapsed === 7 || !elapsed ? "average per day" : `per day · ${elapsed} of 7 days so far`;
  const rows = CATS.filter(c => tot[c.id]).sort((a,b) => tot[b.id]-tot[a.id]);
  const max = tot[rows[0].id];
  el.innerHTML = `
    <div class="wk-top">
      <div><div class="sum-total">${dur(all)}</div><div class="sum-cap">logged this week</div></div>
      <div class="right"><div class="sum-total">${avg(all)}</div><div class="sum-cap">${avgCap}</div></div>
    </div>
    <div class="bar" role="img" aria-label="Time by type this week">${rows.map(c => `<span style="background:${c.color};flex:${tot[c.id]}"></span>`).join("")}</div>
    <div class="wtable" role="table" aria-label="Time by type">
      <span class="h" role="columnheader">Type</span><span class="h num" role="columnheader">Total</span><span class="h num" role="columnheader">Per day</span>
      ${rows.map(c => `<span class="nm"><span class="sw" style="background:${c.color}"></span><span>${esc(c.name)}</span></span><span class="num">${dur(tot[c.id])}</span><span class="num avg">${avg(tot[c.id])}</span><span class="mb" aria-hidden="true"><i style="width:${(tot[c.id]/max*100).toFixed(1)}%;background:${c.color}"></i></span>`).join("")}
    </div>`;
}

function renderWeek(){
  const days = weekDays(day), t = today();
  const per = days.map(withLive);
  renderWeekSummary(days, per, t);

  // Show 7 AM–10 PM, stretched to fit any entry (and the current time) outside that.
  let lo = 7*60, hi = 22*60;
  per.flat().forEach(x => { lo = Math.min(lo, Math.floor(x.start/60)*60); hi = Math.max(hi, Math.ceil(Math.min(x.end,1440)/60)*60); });
  if (days.includes(t)){ const n = nowMin(); lo = Math.min(lo, Math.floor(n/60)*60); hi = Math.max(hi, Math.min(1440, Math.floor(n/60)*60 + 60)); }
  wkLo = lo;
  const height = (hi - lo)/60*WHR;

  $("wkHeadTrack").innerHTML = days.map((d,i) => {
    const dt = parseYmd(d), m = per[i].reduce((a,x) => a + minsOf(x), 0);
    const label = dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}) + (m ? `, ${dur(m)} logged` : "") + ". Open day";
    return `<button type="button" class="wk-day${d===t?" is-today":""}" data-day="${d}" aria-label="${label}"><span class="dow">${dt.toLocaleDateString(undefined,{weekday:"short"}).slice(0,3)}</span><span class="dnum">${dt.getDate()}</span><span class="dtot">${m ? hrs(m) : ""}</span></button>`;
  }).join("");

  let hh = "";
  for (let m = lo; m <= hi; m += 60){ const x = hm(m); hh += `<span style="top:${(m-lo)/60*WHR}px">${m === 720 ? "Noon" : x.h + " " + x.ap}</span>`; }
  $("wkHours").innerHTML = hh;
  $("wkHours").style.height = height + "px";

  const cols = $("wkCols");
  cols.style.height = height + "px";
  cols.innerHTML = days.map((d,i) => `<div class="wk-col${d===t?" is-today":""}" data-day="${d}">` +
    layout(per[i]).map(({x, col, cols:n}) => {
      const c = CAT[x.cat] || CAT.misc;
      const s = Math.max(x.start, lo), e = Math.min(x.end, hi);
      if (e <= s) return "";
      const top = (s - lo)/60*WHR, h = Math.max((e - s)/60*WHR - 2, 10);
      return `<button type="button" class="wblock${x.live ? " is-live" : ""}" data-id="${x.id}" style="top:${top+1}px;height:${h}px;left:calc(${col} * 100% / ${n} + 1px);width:calc(100% / ${n} - 2px);background:${c.color};color:${c.fg}" aria-label="${esc(x.title)}, ${esc(c.name)}, ${fmtRange(x.start, x.end)}">${h >= 14 ? esc(x.title) : ""}${h >= 40 ? `<span class="wr">${fmtRange(x.start, x.end)}</span>` : ""}</button>`;
    }).join("") +
    (d === t ? `<div class="now" style="top:${(nowMin()-lo)/60*WHR}px"></div>` : "") + `</div>`).join("");
  syncWkHead();
}
// The day-header row can't live inside the horizontal scroller (it would lose its vertical stickiness), so it follows the scroller.
function syncWkHead(){ $("wkHeadTrack").style.transform = `translateX(${-$("wkScroll").scrollLeft}px)`; }
$("wkScroll").addEventListener("scroll", syncWkHead, {passive:true});
let wkLand = null;         // "end" when arriving at a week by swiping back past its first day

/* ---------- Rendering & navigation ---------- */
function syncTopbarH(){ document.documentElement.style.setProperty("--topbar-h", $("topbar").offsetHeight + "px"); }
window.addEventListener("resize", syncTopbarH);

function render(){
  renderHeader();
  $("dayView").hidden = view !== "day";
  $("weekView").hidden = view !== "week";
  if (view === "day"){ renderSummary(); renderGrid(); } else renderWeek();
  refreshTitleList();
  renderDock();
  syncTopbarH();
}

function renderDock(){
  const r = db.running;
  $("dock").classList.toggle("has-live", !!r);
  $("live").hidden = !r;
  if (!r) return;
  const c = CAT[r.cat] || CAT.misc;
  $("liveDot").style.cssText = `background:${c.color};color:${c.color}`;
  $("liveTitle").textContent = r.title;
  $("liveSub").textContent = `${c.name} · since ${fmt(r.start)}`;
  $("liveEnd").style.cssText = `background:${c.color};color:${c.fg}`;
  tickDock();
}
function tickDock(){
  const r = db.running; if (!r) return;
  const sec = Math.max(0, Math.floor((Date.now() - runStart(r))/1000));
  const h = Math.floor(sec/3600), m = Math.floor(sec/60) % 60;
  $("liveTime").textContent = (h ? h + ":" + pad(m) : m) + ":" + pad(sec % 60);
}
setInterval(tickDock, 1000);

function scrollToFocus(){
  if (view === "week"){
    window.scrollTo({top:0, behavior:"auto"});
    const sc = $("wkScroll"), i = weekDays(day).indexOf(today()), colW = $("wkCols").offsetWidth / 7;
    sc.scrollLeft = wkLand === "end" ? sc.scrollWidth : i > 0 ? (i - 1) * colW : 0;
    wkLand = null;
    syncWkHead();
    return;
  }
  const H = hourPx(), list = entries(day);
  let m;
  if (day === today()) m = nowMin() - 150;
  else if (list.length) m = Math.min(...list.map(x => x.start)) - 30;
  else m = 7*60;
  const gridTop = $("grid").getBoundingClientRect().top + window.scrollY;
  const header = $("topbar").offsetHeight;
  window.scrollTo({top: Math.max(0, gridTop + clamp(m,0,1440)/60*H - header - 16), behavior:"auto"});
}

function go(d, dir){
  if (d === day) return;
  const sameWeek = view === "week" && weekStartOf(d) === weekStartOf(day);
  day = d;
  render();
  if (sameWeek) return;
  const el = $(view === "day" ? "dayView" : "weekView");
  el.classList.remove("inL","inR"); void el.offsetWidth;
  if (dir) el.classList.add(dir > 0 ? "inL" : "inR");
  scrollToFocus();
}
const step = dir => go(addDays(day, dir * (view === "week" ? 7 : 1)), dir);

function setView(v, d){
  view = v;
  if (d) day = d;
  db.view = v; save();
  render();
  scrollToFocus();
}

/* ---------- Sheets ---------- */
let openSheetEl = null;
function openSheet(el){
  closeSheet(true);
  $("toast").classList.remove("show");
  openSheetEl = el;
  const scrim = $("scrim");
  scrim.hidden = false; el.hidden = false;
  document.body.classList.add("locked");
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add("open"); el.classList.add("open"); }));
}
function closeSheet(instant){
  const el = openSheetEl; if (!el) return;
  openSheetEl = null;
  const scrim = $("scrim");
  el.classList.remove("open"); scrim.classList.remove("open");
  document.body.classList.remove("locked");
  if (document.activeElement && el.contains(document.activeElement)) document.activeElement.blur();
  const done = () => { if (openSheetEl !== el){ el.hidden = true; } if (!openSheetEl) scrim.hidden = true; };
  if (instant || matchMedia("(prefers-reduced-motion: reduce)").matches) done(); else setTimeout(done, 280);
}
$("scrim").addEventListener("click", () => closeSheet());
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeSheet()));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- Entry form ---------- */
(function buildCats(){
  $("catGrid").innerHTML = CATS.map(c =>
    `<button type="button" class="cat" data-cat="${c.id}" aria-pressed="false" style="--c:${c.color};--fg:${c.fg}"><span class="sw" style="background:${c.color}"></span><span>${esc(c.name)}</span></button>`).join("");
  $("catGrid").addEventListener("click", e => {
    const b = e.target.closest(".cat"); if (!b) return;
    setCat(b.dataset.cat); catTouched = true; hideErr();
  });
})();
function setCat(id){
  selCat = id;
  document.querySelectorAll("#catGrid .cat").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === id)));
}

function refreshTitleList(){
  const seen = new Map();
  Object.keys(db.days).sort().reverse().forEach(d => entries(d).forEach(x => { const k = x.title.toLowerCase(); if (!seen.has(k)) seen.set(k, x); }));
  $("titleList").innerHTML = [...seen.values()].slice(0,60).map(x => `<option value="${esc(x.title)}"></option>`).join("");
}
function recentCatFor(title){
  const k = title.trim().toLowerCase(); if (!k) return null;
  const days = Object.keys(db.days).sort().reverse();
  for (const d of days){ const hit = entries(d).slice().reverse().find(x => x.title.toLowerCase() === k); if (hit) return hit.cat; }
  return null;
}
$("fTitle").addEventListener("input", e => {
  if (catTouched) return;
  const c = recentCatFor(e.target.value); if (c) setCat(c);
});
$("fTitle").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); } });

function setFormDate(d){ $("fDate").value = d; $("fDateLbl").textContent = dayName(d); }
$("fDate").addEventListener("change", e => { if (e.target.value) setFormDate(e.target.value); else setFormDate(editDay || day); });
$("fDate").addEventListener("click", e => { try { e.target.showPicker && e.target.showPicker(); } catch(_){} });

function applyMode(){
  const m = sheetMode, timer = m === "start" || m === "running", r = db.running;
  $("modeSeg").hidden = !(m === "past" || m === "start");
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  $("fDateWrap").hidden = m === "start";
  $("toField").hidden = timer;
  $("quick").hidden = timer;
  $("fromLbl").textContent = timer ? "Started at" : "From";
  const note = $("runNote");
  note.hidden = !(m === "start" && r);
  if (m === "start" && r) note.innerHTML = `You're doing <b>${esc(r.title)}</b> (since ${fmt(r.start)}). Starting this ends it at the new start time, so the two never overlap.`;
  $("delBtn").hidden = !(m === "edit" || m === "running");
  $("delBtn").textContent = m === "running" ? "Discard" : "Delete";
  $("altBtn").hidden = m !== "running";
  $("saveBtn").textContent = {past:"Save", edit:"Save changes", start: r ? "Switch to this" : "Start", running:"End now"}[m];
  $("entryTitle").textContent = m === "edit" ? "Edit entry" : m === "running" ? "In progress" : "New entry";
  updateDur();
}
$("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]"); if (!b || b.dataset.mode === sheetMode) return;
  if (b.dataset.mode === "start"){
    pastVals = {d: $("fDate").value, s: $("fStart").value, e: $("fEnd").value};
    $("fStart").value = toHHMM(nowMin());
    setFormDate(today());
  } else if (pastVals){
    setFormDate(pastVals.d); $("fStart").value = pastVals.s; $("fEnd").value = pastVals.e;
  }
  sheetMode = b.dataset.mode;
  db.entryMode = sheetMode; save();
  hideErr(); applyMode();
});

function updateDur(){
  const s = $("fStart").value, e = $("fEnd").value, line = $("durLine");
  if (sheetMode === "start"){
    const n = nowMin(), a = s ? toMin(s) : n;
    line.textContent = a > n ? "" : a === n ? "Starts now" : `Started ${dur(n - a)} ago`;
    return;
  }
  if (sheetMode === "running"){
    const r = db.running;
    line.textContent = r && s ? `Running for ${dur(Math.max(0, runMins({...r, start: toMin(s)})))}` : "";
    return;
  }
  if (!s || !e){ line.textContent = ""; return; }
  let a = toMin(s), b = toMin(e);
  if (b === a){ line.textContent = ""; return; }
  const next = b < a; if (next) b += 1440;
  line.textContent = dur(b - a) + (next ? " · ends after midnight" : "");
}
["fStart","fEnd"].forEach(id => $(id).addEventListener("input", () => { updateDur(); hideErr(); }));
$("fStart").addEventListener("change", updateDur);
$("fEnd").addEventListener("change", updateDur);
$("quick").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  const s = $("fStart").value ? toMin($("fStart").value) : nowMin();
  if (!$("fStart").value) $("fStart").value = toHHMM(s);
  $("fEnd").value = toHHMM(s + Number(b.dataset.m));
  updateDur(); hideErr();
});

function showErr(msg){ const e = $("formErr"); e.textContent = msg; e.hidden = false; }
function hideErr(){ $("formErr").hidden = true; }

function defaultsForNew(d){
  const list = entries(d);
  if (d === today()){
    const now = Math.round(nowMin()/5)*5;
    const prev = list.filter(x => x.end <= now).sort((a,b) => b.end - a.end)[0];
    let s = prev && now - prev.end <= 240 ? prev.end : now - 30;
    s = Math.max(0, s);
    let e = now; if (e - s < 5) e = s + 30;
    return {s, e};
  }
  const last = list.length ? Math.max(...list.map(x => Math.min(x.end, 1440))) : 9*60;
  const s = clamp(last, 0, 1440-15);
  return {s, e: Math.min(s + 60, 1439)};
}

function openNew(d, start, end){
  editing = null; editDay = null; catTouched = false;
  const t = start == null ? defaultsForNew(d) : {s:start, e:end};
  pastVals = {d, s: toHHMM(t.s), e: toHHMM(t.e)};
  // "Start now" is only offered by default from the Log button on today.
  sheetMode = db.entryMode === "start" && start == null && d === today() ? "start" : "past";
  setFormDate(sheetMode === "start" ? today() : d);
  $("fTitle").value = "";
  $("fStart").value = sheetMode === "start" ? toHHMM(nowMin()) : pastVals.s;
  $("fEnd").value = pastVals.e;
  setCat(db.lastCat && CAT[db.lastCat] ? db.lastCat : null);
  hideErr(); applyMode();
  openSheet($("entrySheet"));
}
function openRunning(){
  const r = db.running; if (!r) return;
  editing = null; editDay = null; catTouched = true;
  sheetMode = "running";
  setFormDate(r.day);
  $("fTitle").value = r.title;
  $("fStart").value = toHHMM(r.start);
  setCat(r.cat);
  hideErr(); applyMode();
  openSheet($("entrySheet"));
}
function openNewAt(d, m){
  const nextStart = entries(d).map(x => x.start).filter(v => v > m).sort((a,b) => a-b)[0];
  let end = Math.min(m + 60, 1439);
  if (nextStart != null && nextStart < end) end = nextStart;
  openNew(d, m, end);
}
function openEdit(id, d){
  const x = entries(d).find(e => e.id === id); if (!x) return;
  editing = id; editDay = d; catTouched = true;
  sheetMode = "edit";
  setFormDate(d);
  $("fTitle").value = x.title;
  $("fStart").value = toHHMM(x.start);
  $("fEnd").value = toHHMM(x.end);
  setCat(x.cat);
  hideErr(); applyMode();
  openSheet($("entrySheet"));
}

function submitTimer(endNow){
  if (!selCat) return showErr("Pick a type.");
  const sv = $("fStart").value;
  if (!sv) return showErr("Set a start time.");
  const s = toMin(sv), title = $("fTitle").value.trim() || CAT[selCat].name;
  const snap = JSON.stringify(db);
  if (sheetMode === "start"){
    const t = today(), at = parseYmd(t);
    at.setMinutes(s);
    if (at > new Date()) return showErr("The start time can't be in the future.");
    let prev = null;
    if (db.running){
      if (at <= runStart(db.running)) return showErr(`Pick a time after ${fmt(db.running.start)}, when "${db.running.title}" started.`);
      prev = endRunning(at);
    }
    db.running = {title, cat:selCat, day:t, start:s};
    db.lastCat = selCat; save();
    closeSheet();
    if (!isVisible(t)){ day = t; render(); scrollToFocus(); } else render();
    toast(prev ? `Ended ${prev.r.title}, started ${title}` : `Started ${title}`, "Undo", restore(snap));
    return;
  }
  const r = db.running;
  if (!r){ closeSheet(); render(); return; }
  const at = parseYmd(r.day);
  at.setMinutes(s);
  if (at > new Date()) return showErr("The start time can't be in the future.");
  Object.assign(r, {title, cat:selCat, start:s});
  db.lastCat = selCat;
  let res = null;
  if (endNow) res = endRunning(new Date());
  save(); closeSheet(); render();
  if (!endNow) toast("Changes saved");
  else toast(res.entry ? `Logged ${dur(res.entry.end - res.entry.start)} of ${CAT[res.entry.cat].name}` : "Ended. It was under a minute, so nothing was logged.", "Undo", restore(snap));
}
$("altBtn").addEventListener("click", () => submitTimer(false));
$("liveOpen").addEventListener("click", openRunning);
$("liveEnd").addEventListener("click", () => {
  const snap = JSON.stringify(db), res = endRunning(new Date());
  if (!res) return;
  save(); render();
  toast(res.entry ? `Logged ${dur(res.entry.end - res.entry.start)} of ${CAT[res.entry.cat].name}` : "Ended. It was under a minute, so nothing was logged.", "Undo", restore(snap));
});

$("entryForm").addEventListener("submit", e => {
  e.preventDefault();
  if (sheetMode === "start" || sheetMode === "running") return submitTimer(true);
  if (!selCat) return showErr("Pick a type.");
  const sv = $("fStart").value, ev = $("fEnd").value;
  if (!sv || !ev) return showErr("Set both a start and an end time.");
  const s = toMin(sv); let en = toMin(ev);
  if (en === s) return showErr("The end time has to be after the start time.");
  if (en < s) en += 1440;
  const target = $("fDate").value || editDay || day;
  const title = $("fTitle").value.trim() || CAT[selCat].name;
  if (editing){
    const from = db.days[editDay] || [];
    const i = from.findIndex(v => v.id === editing);
    if (i >= 0) from.splice(i, 1);
    if (!from.length) delete db.days[editDay];
  }
  const list = db.days[target] || (db.days[target] = []);
  list.push({id: editing || uid(), title, cat:selCat, start:s, end:en});
  list.sort((a,b) => a.start - b.start);
  db.lastCat = selCat;
  save();
  const wasEdit = !!editing, moved = wasEdit && target !== editDay;
  closeSheet();
  if (!isVisible(target)){ day = target; render(); scrollToFocus(); } else render();
  toast(moved ? "Moved to " + dayName(target) : wasEdit ? "Changes saved" : "Logged " + dur(en - s) + " of " + CAT[selCat].name);
});

$("delBtn").addEventListener("click", () => {
  if (sheetMode === "running"){
    const snap = JSON.stringify(db);
    db.running = null; save(); closeSheet(); render();
    toast("Timer discarded", "Undo", restore(snap));
    return;
  }
  const d = editDay, list = db.days[d] || [];
  const i = list.findIndex(v => v.id === editing); if (i < 0) return;
  const [gone] = list.splice(i, 1);
  if (!list.length) delete db.days[d];
  save(); closeSheet(); render();
  toast("Entry deleted", "Undo", () => {
    const l = db.days[d] || (db.days[d] = []);
    l.push(gone); l.sort((a,b) => a.start - b.start);
    save(); render();
  });
});

/* ---------- Timeline interactions ---------- */
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".block");
  if (b){ b.dataset.id === LIVE ? openRunning() : openEdit(b.dataset.id, day); return; }
  const r = $("grid").getBoundingClientRect();
  openNewAt(day, clamp(Math.floor((e.clientY - r.top)/hourPx()*60/15)*15, 0, 1440-15));
});
$("wkCols").addEventListener("click", e => {
  const col = e.target.closest(".wk-col"); if (!col) return;
  const b = e.target.closest(".wblock");
  if (b){ b.dataset.id === LIVE ? openRunning() : openEdit(b.dataset.id, col.dataset.day); return; }
  const r = col.getBoundingClientRect();
  openNewAt(col.dataset.day, clamp(wkLo + Math.floor((e.clientY - r.top)/WHR*60/15)*15, 0, 1440-15));
});
$("wkHead").addEventListener("click", e => { const b = e.target.closest(".wk-day"); if (b) setView("day", b.dataset.day); });
$("viewSeg").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b && b.dataset.view !== view) setView(b.dataset.view); });

let tx = null;
$("views").addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { tx = null; return; }
  // Inside the week scroller, a swipe only changes week once the scroller is already at that edge.
  const sc = e.target.closest("#wkScroll, #wkHead") ? $("wkScroll") : null;
  tx = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now(),
        edge: sc && {start: sc.scrollLeft <= 1, end: sc.scrollLeft >= sc.scrollWidth - sc.clientWidth - 1}};
}, {passive:true});
$("views").addEventListener("touchend", e => {
  if (!tx || openSheetEl) return;
  const t = e.changedTouches[0], dx = t.clientX - tx.x, dy = t.clientY - tx.y, dt = Date.now() - tx.t;
  const edge = tx.edge; tx = null;
  if (!(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*2 && dt < 600)) return;
  const dir = dx < 0 ? 1 : -1;
  if (edge && !(dir > 0 ? edge.end : edge.start)) return;
  if (view === "week" && dir < 0 && edge) wkLand = "end";
  step(dir);
}, {passive:true});

$("prevDay").addEventListener("click", () => step(-1));
$("nextDay").addEventListener("click", () => step(1));
$("todayBtn").addEventListener("click", () => { const t = today(); go(t, t > day ? 1 : -1); });
$("datePick").addEventListener("change", e => { const v = e.target.value; if (v) go(v, v > day ? 1 : -1); });
$("datePick").addEventListener("click", e => { try { e.target.showPicker && e.target.showPicker(); } catch(_){} });
$("fab").addEventListener("click", () => openNew(view === "week" && weekDays(day).includes(today()) ? today() : day));

window.addEventListener("scroll", () => $("topbar").classList.toggle("scrolled", window.scrollY > 4), {passive:true});
// While a timer runs, re-render so its block and the totals keep growing.
setInterval(() => db.running ? render() : renderNow(), 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) db.running ? render() : renderNow(); });

/* ---------- Settings ---------- */
function syncWsSeg(){ document.querySelectorAll("#wsSeg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.ws) === (db.weekStart === 0 ? 0 : 1)))); }
$("wsSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-ws]"); if (!b) return;
  db.weekStart = Number(b.dataset.ws); save(); syncWsSeg(); render();
});

/* ---------- Backup ---------- */
$("menuBtn").addEventListener("click", () => {
  const n = Object.values(db.days).reduce((a,l) => a + l.length, 0), dcount = Object.keys(db.days).length;
  syncWsSeg();
  $("statsNote").textContent = n ? `${n} ${n===1?"entry":"entries"} across ${dcount} ${dcount===1?"day":"days"}.` : "No entries yet.";
  openSheet($("menuSheet"));
});
$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({app:"daily-proficiency", version:1, exported:new Date().toISOString(), ...db}, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `daily-proficiency-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Backup exported");
});
$("importFile").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data.days !== "object") throw 0;
      let added = 0;
      for (const [d, list] of Object.entries(data.days)){
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !Array.isArray(list)) continue;
        const cur = db.days[d] || (db.days[d] = []);
        const ids = new Set(cur.map(x => x.id));
        list.forEach(x => {
          if (!x || ids.has(x.id) || !CAT[x.cat] || typeof x.start !== "number" || typeof x.end !== "number") return;
          cur.push({id:String(x.id || uid()), title:String(x.title || CAT[x.cat].name), cat:x.cat, start:x.start, end:x.end}); added++;
        });
        cur.sort((a,b) => a.start - b.start);
        if (!cur.length) delete db.days[d];
      }
      save(); closeSheet(); render();
      toast(added ? `Imported ${added} ${added===1?"entry":"entries"}` : "Nothing new in that backup");
    } catch(_){ toast("That file isn't a Daily Proficiency backup."); }
    e.target.value = "";
  };
  r.readAsText(f);
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, actLabel, act){
  const t = $("toast"), b = $("toastAct");
  $("toastMsg").textContent = msg;
  b.hidden = !actLabel;
  b.textContent = actLabel || "";
  b.onclick = act ? () => { act(); t.classList.remove("show"); } : null;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), actLabel ? 5000 : 2200);
}

/* ---------- Boot ---------- */
render();
requestAnimationFrame(scrollToFocus);

try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
} catch(e){}
})();
</script>
